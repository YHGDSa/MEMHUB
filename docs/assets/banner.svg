<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">MEMHUB — local-first memory hub for multi-agent workflows</title>
  <desc id="desc">Animated banner: the word MEMHUB in monospace, a subtitle, and three capability chips.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#101A33"/>
      <stop offset="100%" stop-color="#0B1220"/>
      <animate attributeName="x2" values="1;1.25;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.75;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#34D058"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2A44" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="18" fill="url(#grid)"/>

  <!-- slow drifting dots: the "agent traffic" -->
  <g fill="#22D3EE" opacity="0.9">
    <circle cx="60" cy="220" r="3">
      <animate attributeName="cx" values="60;1140;60" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="48" r="2.5" fill="#8B5CF6">
      <animate attributeName="cx" values="1080;80;1080" dur="34s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="236" r="2" fill="#34D058">
      <animate attributeName="cx" values="980;40;980" dur="40s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- title -->
  <text x="72" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="76" font-weight="700" letter-spacing="8" fill="#E8EEF9" filter="url(#glow)">MEMHUB</text>

  <!-- blinking caret next to the title -->
  <rect x="398" y="74" width="12" height="58" fill="url(#accent)">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <text x="74" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="21" letter-spacing="2.5" fill="#93A4C3">LOCAL-FIRST MEMORY HUB FOR MULTI-AGENT WORKFLOWS</text>

  <!-- underline sweep -->
  <rect x="74" y="192" width="1052" height="3" fill="url(#accent)" opacity="0.85">
    <animate attributeName="width" values="0;1052;1052" dur="3.2s" fill="freeze"/>
  </rect>

  <!-- capability chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.5">
    <rect x="74" y="214" width="150" height="32" rx="16" fill="#12203C" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="92" y="235" fill="#BFE9F5">OFFLINE WRITE</text>

    <rect x="238" y="214" width="132" height="32" rx="16" fill="#12203C" stroke="#8B5CF6" stroke-opacity="0.55"/>
    <text x="256" y="235" fill="#DCD2FA">OUTBOX</text>

    <rect x="384" y="214" width="176" height="32" rx="16" fill="#12203C" stroke="#34D058" stroke-opacity="0.55"/>
    <text x="402" y="235" fill="#C6F0D2">TOMBSTONES</text>

    <rect x="574" y="214" width="188" height="32" rx="16" fill="#12203C" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="592" y="235" fill="#BFE9F5">RECONCILE</text>
  </g>

  <text x="1126" y="235" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#6B7B99">41 + 19 assertions</text>
</svg>
