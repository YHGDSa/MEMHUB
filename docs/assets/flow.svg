<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="ftitle fdesc">
  <title id="ftitle">Write path: agents write to the local hub, an outbox replays to the upstream</title>
  <desc id="fdesc">Agents write to the local hub; the hub stores in SQLite and queues writes in an outbox; the outbox replays to an optional upstream over a tunnel. Dashed lines animate to show flow.</desc>

  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="260" rx="16" fill="#0B1220"/>
  <rect width="1100" height="260" rx="16" fill="none" stroke="#1E2A44"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- agents -->
    <rect x="40" y="90" width="180" height="86" rx="12" fill="#101A33" stroke="#2B3B5E"/>
    <text x="130" y="126" text-anchor="middle" font-size="16" fill="#E8EEF9" letter-spacing="1.5">AGENTS</text>
    <text x="130" y="150" text-anchor="middle" font-size="12" fill="#7E8FB0">loopback only</text>

    <!-- hub -->
    <rect x="330" y="60" width="270" height="146" rx="14" fill="#12203C" stroke="#22D3EE" stroke-opacity="0.7"/>
    <text x="465" y="94" text-anchor="middle" font-size="17" fill="#BFE9F5" letter-spacing="2">LOCAL HUB</text>
    <text x="465" y="122" text-anchor="middle" font-size="12" fill="#9FB3D1">sqlite · WAL</text>
    <rect x="356" y="138" width="104" height="28" rx="8" fill="#0E1A30" stroke="#34D058" stroke-opacity="0.6"/>
    <text x="408" y="157" text-anchor="middle" font-size="12" fill="#C6F0D2">outbox</text>
    <rect x="470" y="138" width="104" height="28" rx="8" fill="#0E1A30" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text x="522" y="157" text-anchor="middle" font-size="12" fill="#DCD2FA">tombstones</text>
    <text x="465" y="192" text-anchor="middle" font-size="11" fill="#6B7B99">write succeeds locally · 200</text>

    <!-- upstream -->
    <rect x="760" y="90" width="300" height="86" rx="12" fill="#101A33" stroke="#2B3B5E" stroke-dasharray="6 6"/>
    <text x="910" y="126" text-anchor="middle" font-size="15" fill="#C7D3E8" letter-spacing="1.5">UPSTREAM</text>
    <text x="910" y="150" text-anchor="middle" font-size="11" fill="#7E8FB0">optional · 4 endpoints</text>

    <!-- agent -> hub: solid with pulses -->
    <line x1="220" y1="133" x2="330" y2="133" stroke="#22D3EE" stroke-width="2"/>
    <circle r="4" fill="#22D3EE">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M220,133 L330,133"/>
    </circle>

    <!-- hub -> upstream: dashed, animated offset (replay) -->
    <line x1="600" y1="133" x2="760" y2="133" stroke="url(#fg)" stroke-width="2.5" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <text x="680" y="120" text-anchor="middle" font-size="11" fill="#8B9AB8">replay when reachable</text>

    <!-- failure path -->
    <path d="M600,160 C660,210 700,210 760,160" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.75">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <text x="680" y="228" text-anchor="middle" font-size="11" fill="#C9A45C">upstream offline → keep queuing, never lose the write</text>
  </g>
</svg>
