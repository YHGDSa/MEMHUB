name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: end-to-end smoke
        run: node test/smoke.mjs
      - name: two-machine consistency
        run: node test/multi-hub.mjs
